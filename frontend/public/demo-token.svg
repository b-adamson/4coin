<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="coinGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="35%" stop-color="#ffd54a"/>
      <stop offset="75%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#c97f0c"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0b8"/>
      <stop offset="100%" stop-color="#b5730a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="92" fill="url(#ring)" filter="url(#soft)"/>
  <circle cx="100" cy="100" r="80" fill="url(#coinGrad)"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#8a5c08" stroke-width="2" opacity="0.4"/>
  <circle cx="100" cy="100" r="68" fill="none" stroke="#8a5c08" stroke-width="1.5" opacity="0.35"/>

  <!-- dot border, like a classic coin -->
  <g fill="#8a5c08" opacity="0.4">
    <circle cx="100" cy="24" r="2"/>
    <circle cx="151" cy="49" r="2"/>
    <circle cx="176" cy="100" r="2"/>
    <circle cx="151" cy="151" r="2"/>
    <circle cx="100" cy="176" r="2"/>
    <circle cx="49" cy="151" r="2"/>
    <circle cx="24" cy="100" r="2"/>
    <circle cx="49" cy="49" r="2"/>
  </g>

  <text x="100" y="128" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="#7a4e08" opacity="0.9">R</text>
  <text x="100" y="126" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="#fff6dc">R</text>
</svg>
